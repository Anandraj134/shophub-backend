openapi: 3.0.3
info:
  title: E-commerce Backend API
  version: 1.0.0
  description: |
    OpenAPI specification generated from the source code in this repository.

    Notes:
    - Base path has no `/api` prefix.
    - This spec reflects the current code, including route naming inconsistencies.
    - Many admin-style routes are not protected in the backend.
    - `GET /getsinglesubcat` is documented as implemented, even though the route is misconfigured.
servers:
  - url: http://localhost:5001
    description: Local development server
tags:
  - name: Auth & Users
  - name: Staff
  - name: Categories
  - name: Subcategories
  - name: Products
  - name: Orders & Payments
  - name: FAQ
  - name: Contact
paths:
  /signup:
    post:
      tags: [Auth & Users]
      summary: Create a new user account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              default:
                value:
                  data:
                    name: Anand
                    email: anand@example.com
                    phone: '9999999999'
                    password: secret123
                    loginVia: false
      responses:
        '200':
          description: User created or duplicate user reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              examples:
                created:
                  value:
                    message: user created successfully
                    status: 1
                duplicate:
                  value:
                    message: user already exist
                    status: 0
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                message: Error in sign up
                status: 1

  /login:
    post:
      tags: [Auth & Users]
      summary: Log in a user and receive a JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LoginRequest'
                - $ref: '#/components/schemas/LoginViaRequest'
            examples:
              passwordLogin:
                value:
                  data:
                    email: anand@example.com
                    password: secret123
              loginVia:
                value:
                  data:
                    name: Anand
                    email: anand@example.com
                    loginVia: true
      responses:
        '200':
          description: Login success or logical auth failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/AuthFailureResponse'
              examples:
                success:
                  value:
                    message: Authenticated!,User Login Successfuly
                    token: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    status: true
                    role: customer
                wrongPassword:
                  value:
                    message: Password Incorrect
                    status: false
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthFailureResponse'
              example:
                message: Internal server error
                status: false

  /updateuser/{id}:
    patch:
      tags: [Auth & Users]
      summary: Update a user by id
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithUpdateCount'
              example:
                message: User Details Updated Successfully
                data: [1]
        '500':
          $ref: '#/components/responses/InternalServerError'

  /deleteUser/{id}:
    delete:
      tags: [Auth & Users]
      summary: Delete a user by id
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlagMessage'
              example:
                message: Error in deleting user
                success: false

  /getalluser:
    get:
      tags: [Auth & Users]
      summary: List all users
      operationId: getAllUsers
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /getuserbyid/{email}:
    get:
      tags: [Auth & Users]
      summary: Get one user by email
      operationId: getUserByEmail
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: User row or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /roleupdate/{id}:
    patch:
      tags: [Auth & Users]
      summary: Update user role and access flags
      operationId: roleUpdate
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: Role updated or logical failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RoleUpdateResponse'
                  - $ref: '#/components/schemas/RoleUpdateFailureResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlagMessage'
              example:
                message: Internal Server erroror editUser
                success: 0

  /addstaff:
    post:
      tags: [Staff]
      summary: Create a staff member
      operationId: addStaff
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreateRequest'
      responses:
        '200':
          description: Staff created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCreateResponse'
        '500':
          description: Duplicate staff or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              examples:
                duplicate:
                  value:
                    message: Staff Member already exists

  /getstaffs:
    get:
      tags: [Staff]
      summary: List all staff members
      operationId: getStaffs
      responses:
        '200':
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMember'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /getsinglestaff/{id}:
    get:
      tags: [Staff]
      summary: Get one staff member by id
      operationId: getSingleStaff
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Staff row or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /updatestaff/{id}:
    patch:
      tags: [Staff]
      summary: Update a staff member
      operationId: updateStaff
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreateRequest'
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlagMessage'
              example:
                success: 1
                message: Data updated Successfully
        '500':
          description: Update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlagMessage'
              example:
                success: 0
                message: Data does not updated

  /deletestaff/{id}:
    delete:
      tags: [Staff]
      summary: Delete a staff member
      operationId: deleteStaff
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Staff deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Deleted the user
        '500':
          $ref: '#/components/responses/InternalServerError'

  /addcategory:
    post:
      tags: [Categories]
      summary: Create a category
      operationId: addCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '200':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCreateResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /getallcategory:
    get:
      tags: [Categories]
      summary: List all categories
      operationId: getAllCategories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '404':
          description: No category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: No Category Found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /getsignlecategory/{id}:
    get:
      tags: [Categories]
      summary: Get a category by id
      operationId: getSingleCategory
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Category result array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /updatecategory/{id}:
    patch:
      tags: [Categories]
      summary: Update a category name
      operationId: updateCategory
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_name]
              properties:
                category_name:
                  type: string
              example:
                category_name: Consumer Electronics
      responses:
        '200':
          description: Update count array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCountArray'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /deletecategory/{id}:
    delete:
      tags: [Categories]
      summary: Delete a category
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Category Deleted Succesfully
        '400':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: No such Category found.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /addsubcategory:
    post:
      tags: [Subcategories]
      summary: Create a subcategory
      operationId: addSubcategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubcategoryCreateRequest'
      responses:
        '200':
          description: Subcategory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subcategory'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /getallsubcategory:
    get:
      tags: [Subcategories]
      summary: List all subcategories with parent category
      operationId: getAllSubcategories
      responses:
        '200':
          description: Subcategory list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubcategoryWithCategory'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /getsinglesubcat:
    get:
      tags: [Subcategories]
      summary: Misconfigured single-subcategory endpoint
      description: The route has no `{id}` segment, but the controller expects `req.params.id`.
      operationId: getSingleSubcategoryBroken
      responses:
        '200':
          description: Undefined or null-like result depending on runtime behavior
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subcategory'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /updatesubcat/{id}:
    patch:
      tags: [Subcategories]
      summary: Update a subcategory
      operationId: updateSubcategory
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubcategoryCreateRequest'
      responses:
        '200':
          description: Subcategory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusAndDataResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /removesubcate/{id}:
    delete:
      tags: [Subcategories]
      summary: Delete a subcategory
      operationId: deleteSubcategory
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Destroy count
          content:
            application/json:
              schema:
                type: integer
                example: 1
        '500':
          $ref: '#/components/responses/InternalServerError'

  /addProduct:
    post:
      tags: [Products]
      summary: Create a product with images
      operationId: addProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreateForm'
      responses:
        '200':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '500':
          description: Product creation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Something went wrong in add Product ctrl

  /getSingleProduct/{id}:
    get:
      tags: [Products]
      summary: Get one product by id
      operationId: getSingleProduct
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Product row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '500':
          description: Product fetch error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Something went wrong in get Product by id ctrl

  /getAllProduct:
    get:
      tags: [Products]
      summary: List all products
      operationId: getAllProducts
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /getProductByCate/{id}:
    get:
      tags: [Products]
      summary: List products by category id
      operationId: getProductsByCategory
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Filtered product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Product fetch error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Something went wrong in get Product by category ctrl

  /getProductByCategAndSubCate/{subcate}/{categ}:
    get:
      tags: [Products]
      summary: List products by subcategory and category
      operationId: getProductsByCategoryAndSubcategory
      parameters:
        - name: subcate
          in: path
          required: true
          schema:
            type: integer
        - name: categ
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Filtered product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /updateProductImg/{id}:
    post:
      tags: [Products]
      summary: Append images to a product
      operationId: updateProductImages
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductImageUploadForm'
      responses:
        '200':
          description: Images updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Updated  Successfully
        '500':
          description: Product image update error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Something went wrong in update Product by id ctrl

  /specificImgDelete/{id}/{index}:
    post:
      tags: [Products]
      summary: Delete a single image from a product by array index
      operationId: deleteSpecificProductImage
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sequelize update count array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCountArray'
        '500':
          description: Image delete error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Something went wrong in specific img ctrl

  /updateProductDetail/{id}:
    patch:
      tags: [Products]
      summary: Update product fields and optional replacement images
      operationId: updateProductDetail
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductUpdateForm'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusAndDataResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /deleteProduct/{id}:
    delete:
      tags: [Products]
      summary: Delete a product
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Item Deleted Succesfully
        '500':
          description: Product delete error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Something went wrong in delete Product by id ctrl

  /getproductbyvandor:
    get:
      tags: [Products]
      summary: Paginated product list filtered by vendor
      operationId: getProductsByVendor
      parameters:
        - name: vendor
          in: query
          required: true
          schema:
            type: string
            example: vendor@example.com
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductsResponse'
        '500':
          description: Product fetch error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessage'
              example:
                message: Something went wrong in get Product by id ctrl

  /getproManageByCate:
    get:
      tags: [Products]
      summary: Paginated vendor products filtered by category
      operationId: getProductsByVendorAndCategory
      parameters:
        - name: vandor
          in: query
          required: true
          schema:
            type: string
            example: vendor@example.com
        - name: category
          in: query
          required: true
          schema:
            type: integer
            example: 1
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /getProManageBySub:
    get:
      tags: [Products]
      summary: Paginated vendor products filtered by category and subcategory
      operationId: getProductsByVendorCategorySubcategory
      parameters:
        - name: vandor
          in: query
          required: true
          schema:
            type: string
            example: vendor@example.com
        - name: category
          in: query
          required: true
          schema:
            type: integer
            example: 1
        - name: subcate
          in: query
          required: true
          schema:
            type: integer
            example: 2
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /getProOnNext:
    get:
      tags: [Products]
      summary: Alternate paginated vendor/product endpoint
      operationId: getProductsOnNext
      parameters:
        - name: vendor
          in: query
          required: true
          schema:
            type: string
            example: all
        - name: category
          in: query
          required: false
          schema:
            type: string
            example: '1'
        - name: subcate
          in: query
          required: false
          schema:
            type: string
            example: '2'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /getallorder:
    get:
      tags: [Orders & Payments]
      summary: List all customer orders
      operationId: getAllOrders
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerOrder'
        '500':
          description: Order fetch error
          content:
            application/json:
              schema:
                oneOf:
                  - type: string
                    example: Customer order not Found
                  - $ref: '#/components/schemas/GenericMessage'

  /getsingleorder/{id}:
    get:
      tags: [Orders & Payments]
      summary: Get one order by id
      operationId: getSingleOrder
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Array with matching order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerOrder'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                type: string
                example: The Customer Order you are looking for is not available!
        '500':
          $ref: '#/components/responses/InternalServerError'

  /addorder:
    post:
      tags: [Orders & Payments]
      summary: Create a Razorpay order
      operationId: createRazorpayOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRazorpayOrderRequest'
      responses:
        '200':
          description: Razorpay order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RazorpayOrder'
        '500':
          description: Razorpay or server error
          content:
            application/json:
              schema:
                oneOf:
                  - type: string
                    example: Some error occured
                  - type: object

  /success:
    post:
      tags: [Orders & Payments]
      summary: Verify payment signature and persist the order
      operationId: verifyPaymentAndSaveOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSuccessRequest'
      responses:
        '200':
          description: Payment verified and order stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSuccessResponse'
        '400':
          description: Signature verification failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                example:
                  msg: Transaction not legit!
        '500':
          $ref: '#/components/responses/InternalServerError'

  /updateorder/{id}:
    patch:
      tags: [Orders & Payments]
      summary: Update an order by id
      operationId: updateOrder
