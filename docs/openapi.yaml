components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
    PageQuery:
      name: page
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    PageSizeQuery:
      name: pageSize
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 10

  responses:
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericMessage'
          example:
            message: Internal server error

  schemas:
    PermissionFlags:
      type: object
      properties:
        canManageProducts:
          type: boolean
        canManageCategory:
          type: boolean
        canManageSubCategory:
          type: boolean
        canManageUsers:
          type: boolean
        canManageOrders:
          type: boolean
      example:
        canManageProducts: false
        canManageCategory: false
        canManageSubCategory: false
        canManageUsers: false
        canManageOrders: false

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
        loginVia:
          type: boolean
        role:
          type: string
          enum: [admin, vandor, customer]
        canAccess:
          $ref: '#/components/schemas/PermissionFlags'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 1
        name: Anand
        email: anand@example.com
        phone: '9999999999'
        password: '$2b$10$...'
        loginVia: false
        role: customer
        canAccess:
          canManageProducts: false
          canManageCategory: false
          canManageSubCategory: false
          canManageUsers: false
          canManageOrders: false
        createdAt: '2024-01-01T00:00:00.000Z'
        updatedAt: '2024-01-01T00:00:00.000Z'

    SignupPayload:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
        loginVia:
          type: boolean
        role:
          type: string
          enum: [admin, vandor, customer]
      example:
        name: Anand
        email: anand@example.com
        phone: '9999999999'
        password: secret123
        loginVia: false

    SignupRequest:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SignupPayload'

    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      example:
        email: anand@example.com
        password: secret123

    LoginRequest:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LoginPayload'

    LoginViaPayload:
      type: object
      required: [name, email, loginVia]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        loginVia:
          type: boolean
      example:
        name: Anand
        email: anand@example.com
        loginVia: true

    LoginViaRequest:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LoginViaPayload'

    StatusMessageResponse:
      type: object
      properties:
        message:
          type: string
        status:
          oneOf:
            - type: integer
            - type: boolean
      example:
        message: user created successfully
        status: 1

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        status:
          type: boolean
        role:
          type: string
          enum: [admin, vandor, customer]
      example:
        message: Authenticated!,User Login Successfuly
        token: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        status: true
        role: customer

    AuthFailureResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: boolean
      example:
        message: Password Incorrect
        status: false

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
      example:
        name: Anand Patel
        phone: '8888888888'
        password: newSecret123

    RoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, vandor, customer]
        canManageProducts:
          type: boolean
        canManageCategory:
          type: boolean
        canManageSubCategory:
          type: boolean
        canManageUsers:
          type: boolean
        canManageOrders:
          type: boolean
      example:
        role: admin
        canManageProducts: true
        canManageCategory: true
        canManageSubCategory: true
        canManageUsers: true
        canManageOrders: true

    RoleUpdateResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/RoleUpdateRequest'
        success:
          type: integer
      example:
        message: Role updated successfully.
        data:
          role: admin
          canManageProducts: true
          canManageCategory: true
          canManageSubCategory: true
          canManageUsers: true
          canManageOrders: true
        success: 1

    RoleUpdateFailureResponse:
      type: object
      properties:
        message:
          type: string
        success:
          type: integer
      example:
        message: Error in update role
        success: 0

    SuccessFlagMessage:
      type: object
      properties:
        success:
          oneOf:
            - type: boolean
            - type: integer
        message:
          type: string
      example:
        success: 1
        message: Data updated Successfully

    DeleteUserResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        success:
          type: boolean
      example:
        id: '5'
        message: User deleted successfully
        success: true

